<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Mutatio — Lightweight Windows 11 and 10 taskbar appearance engine">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141418" />
      <stop offset="55%" stop-color="#18181C" />
      <stop offset="100%" stop-color="#111C18" />
    </linearGradient>
    <radialGradient id="glowEmerald" cx="85%" cy="22%" r="45%">
      <stop offset="0%" stop-color="#0E7A4D" stop-opacity="0.34" />
      <stop offset="100%" stop-color="#0E7A4D" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowBlue" cx="14%" cy="88%" r="42%">
      <stop offset="0%" stop-color="#3B9EFF" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#3B9EFF" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0" />
      <stop offset="30%" stop-color="#34D399" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#3B9EFF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#3B9EFF" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Outer card -->
  <rect x="1" y="1" width="1198" height="298" rx="18" fill="url(#bg)" stroke="#2E2E36" stroke-width="2" />
  <rect x="1" y="1" width="1198" height="298" rx="18" fill="url(#glowEmerald)" />
  <rect x="1" y="1" width="1198" height="298" rx="18" fill="url(#glowBlue)" />

  <!-- Subtle architectural grid -->
  <g stroke="#262630" stroke-width="1" opacity="0.55">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="200" y1="0" x2="200" y2="300" />
    <line x1="400" y1="0" x2="400" y2="300" />
    <line x1="600" y1="0" x2="600" y2="300" />
    <line x1="800" y1="0" x2="800" y2="300" />
    <line x1="1000" y1="0" x2="1000" y2="300" />
  </g>

  <!-- Top subtle accent bar -->
  <rect x="160" y="1" width="880" height="2" fill="url(#accentLine)" />

  <!-- Title -->
  <text x="600" y="118" text-anchor="middle" fill="#F8F8FC" font-family="'Segoe UI Variable Display', 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="64" font-weight="700" letter-spacing="-1">
    Mutatio
  </text>

  <!-- Tagline -->
  <text x="600" y="162" text-anchor="middle" fill="#B8BCCB" font-family="'Segoe UI Variable Text', 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="21" font-weight="400">
    Lightweight taskbar appearance engine for Windows 11 &amp; 10
  </text>

  <!-- Feature pills -->
  <g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="13.5" font-weight="600">
    <rect x="190" y="202" width="132" height="34" rx="17" fill="#1E1E25" stroke="#2E2E36" stroke-width="1.2" />
    <circle cx="212" cy="219" r="4" fill="#34D399" />
    <text x="225" y="224" fill="#E4E6EE">Rust 2024</text>

    <rect x="338" y="202" width="234" height="34" rx="17" fill="#1E1E25" stroke="#2E2E36" stroke-width="1.2" />
    <circle cx="360" cy="219" r="4" fill="#3B9EFF" />
    <text x="373" y="224" fill="#E4E6EE">Win11 XAML + Win10 DWM</text>

    <rect x="588" y="202" width="174" height="34" rx="17" fill="#1E1E25" stroke="#2E2E36" stroke-width="1.2" />
    <circle cx="610" cy="219" r="4" fill="#34D399" />
    <text x="623" y="224" fill="#E4E6EE">Event-Driven Loop</text>

    <rect x="778" y="202" width="232" height="34" rx="17" fill="#1E1E25" stroke="#2E2E36" stroke-width="1.2" />
    <circle cx="800" cy="219" r="4" fill="#3B9EFF" />
    <text x="813" y="224" fill="#E4E6EE">Flyout UI · CLI · Pipe IPC</text>
  </g>
</svg>
